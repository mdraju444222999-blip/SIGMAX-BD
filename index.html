<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGMAX - Battle Royale Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            color: white;
        }
        /* লবি ব্যাকগ্রাউন্ড (Sigmax Style) */
        #lobby-screen {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #3b4280 0%, #1e2246 65%, #111329 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 20px;
        }
        /* পেছনের বড় জানালা / ভিউ */
        .lobby-window {
            position: absolute;
            top: 12%;
            left: 15%;
            width: 70%;
            height: 62%;
            background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 50%, #e0f2fe 100%);
            border-radius: 60px;
            border: 8px solid #2e3468;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .city-bg {
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, #6366f1, #a5b4fc);
            clip-path: polygon(0 100%, 0 40%, 15% 40%, 15% 20%, 30% 20%, 30% 50%, 50% 30%, 70% 50%, 70% 15%, 85% 15%, 85% 45%, 100% 35%, 100% 100%);
            opacity: 0.7;
        }
        .banner-text {
            position: absolute;
            top: 20px;
            left: 40px;
            font-size: 28px;
            font-weight: 900;
            color: rgba(255,255,255,0.6);
            letter-spacing: 3px;
            transform: skewX(-10deg);
        }
        /* টপ বার */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .profile-box {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            padding: 6px 15px 6px 6px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .fps-badge {
            background: rgba(0,0,0,0.6);
            color: #4ade80;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .currency-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .currency {
            background: rgba(15, 23, 42, 0.8);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        /* ক্যারেক্টার ক্যানভাস */
        #character-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: grab;
        }
        /* বাম পাশের মেনু */
        .left-menu {
            position: absolute;
            left: 20px;
            top: 22%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .event-card {
            width: 110px;
            height: 55px;
            background: linear-gradient(135deg, #ec4899, #6366f1);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
        }
        /* নিচের বার ও START বাটন */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        .start-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .mode-box {
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-weight: bold;
        }
        .start-btn {
            background: linear-gradient(90deg, #facc15, #eab308);
            color: #0f172a;
            border: none;
            padding: 14px 48px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            letter-spacing: 1px;
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }

        /* গেম স্ক্রিন (Battle Mode) */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background: #1e293b;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .exit-btn {
            pointer-events: auto;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        /* মোবাইল কন্ট্রোল */
        .mobile-controls {
            position: absolute;
            bottom: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            gap: 5px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shoot-btn {
            width: 75px;
            height: 75px;
            background: rgba(239, 68, 68, 0.75);
            border: 3px solid #fca5a5;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- লবি স্ক্রিন -->
    <div id="lobby-screen">
        <div class="lobby-window">
            <div class="banner-text">ALLSTAR // SIGMAX</div>
            <div class="city-bg"></div>
        </div>

        <div class="top-bar">
            <div style="display:flex; align-items:center;">
                <div class="profile-box">
                    <div class="avatar">SG</div>
                    <div>
                        <div style="font-size:13px; font-weight:bold;">PLAYER_ONE</div>
                        <div style="font-size:11px; color:#94a3b8;">LVL 42 • PRO</div>
                    </div>
                </div>
                <div class="fps-badge" id="fps-counter">60 FPS</div>
            </div>

            <div class="currency-bar">
                <div class="currency">🪙 <span id="coins">15,400</span></div>
                <div class="currency">💎 <span id="diamonds">520</span></div>
